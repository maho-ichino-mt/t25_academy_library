<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common :: meta_header('書籍登録',~{::link},~{::script})}">
    <title th:text="${title}+' | MTLibrary'"></title>
    <link rel="stylesheet" th:href="@{/css/book/add.css}" />
    <script type="text/javascript" th:src="@{/js/book/add.js}"></script>
</head>

<body>
    <div class="contents">
        <div th:replace="~{common :: main_sidebar}"></div>
        <div class="main_contents">
            <div th:replace="~{common :: header}"></div>
            <div class="inner_contens">
                <div class="page_title">書籍登録</div>
                <div class="page_contents">
                    <a style="color:red">*は必須項目です</a>
                    <a id="book_register_form" th:object="${BookMstDto}" th:action="@{/book/add}" method="post">
                        <div class="mb30 flexarea">
                            <span>
                                <a th:href="@{/book/index}" class="link">← 一覧へ戻る</a>
                            </span>
                        </div>
                    </a>
                </div>
                <form id="book_register_form" th:object="${bookMstDto}" th:action="@{/book/add}" method="post">
                    <div>書籍名 <span style="color:red;">*</span></div>  
                    <input class="form_input" type="text" name="title" th:field="*{title}" placeholder="書籍名を入力"/>
                    <div class="asterisk" th:if="${errtitle}" th:each="err : ${errtitle}" style="color:red;">
                        <span th:text="${err}"></span><br>
                    </div>
                    <div>ISBN <span style="color:red;">*</span></div>
                    <input class="form_input" type="text" name="isbn" th:field="*{isbn}" placeholder="ISBNを入力"/>
                    <div th:if="${errisbn}" th:each="err : ${errisbn}" style="color:red;">
                        <span th:text="${err}"></span><br>
                    </div>
                    <div class="btn_block">
                        <button id="submit_btn">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div th:replace="~{common :: footer}"></div>
</body>
