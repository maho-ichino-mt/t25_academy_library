<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common :: meta_header('書籍登録',~{::link},~{::script})}">
    <title th:text="${title}+' | MTLibrary'"></title>
    <link rel="stylesheet" th:href="@{/css/book/add.css}" />
    <script type="text/javascript" th:src="@{/js/book/add.js}"></script>
</head>

<body>
    <div class="contents">
        <div th:replace="~{common :: main_sidebar}"></div>
        <div class="main_contents">
            <div th:replace="~{common :: header}"></div>
            <div class="inner_contens">
                <div class="page_title">書籍登録</div>
                <div class="page_contents">
                    <form id="book_register_form" th:object="${BookMstDto}" th:action="@{/book/add}" method="post">
                        <div class="mb30 flexarea">
                            <span>
                                <a th:href="@{/book/index}" class="link">← 一覧へ戻る</a>
                            </span>
                        </div>
                    </form>
                </div>
                <form id="book_register_form" th:object="${bookMstDto}" th:action="@{/book/add}" method="post">
                    <table>
                        <tbody>
                            <tr>
                                <th style="color:red">*は必須項目です</th>
                            </tr>
                            <tr>
                                <th >書籍名 <span style="color:red;">*</span></th>
                            </tr>
                            <td>
                                <input type="text" name="title" th:field="*{title}" placeholder="書籍名を入力"/>
                                <!--<p th:text="${title}"></p>-->
                                <ul th:if="${errtitle}" th:each="err : ${errtitle}" style="color:red;">
                                    <li th:text="${err}"></li>
                                </ul>
                            </td>
                            <tr>
                                <th>ISBN <span style="color:red;">*</span></th>
                            </tr>
                            <td>
                                <input type="text" name="isbn" th:field="*{isbn}" placeholder="ISBNを入力"/>
                                <!--<p th:text="${isbn}"></p>-->
                                <ul th:if="${errisbn}" th:each="err : ${errisbn}" style="color:red;">
                                    <li th:text="${err}"></li>
                                </ul>
                            </td>
                        </tbody>
                    </table>
                    <div class="submit_btn">
                        <input type="submit" value="保存">
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div th:replace="~{common :: footer}"></div>
</body>
